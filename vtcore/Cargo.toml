[package]
name = "vtcore"
version = "0.1.0"
edition = "2021"
description = "WT-NameRelay 语音批量规范字节的权威实现（Rust / PyO3）"
license = "GPL-3.0-only"
publish = false

[lib]
name = "vtcore"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
chacha20poly1305 = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = "0.4.3"
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
sha2 = "0.11.0"

[dev-dependencies]
serde_json = "1.0.151"
